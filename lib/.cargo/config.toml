# wasm SIMD is worth 1.37x on the render pipeline and makes the binary *smaller*
# (vector ops are more compact than the unrolled scalar loops they replace), so
# it is on by default rather than left to whoever remembers the RUSTFLAGS.
#
# Cloudflare Workers and every current browser support it. Verified running under
# workerd, not just assumed.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]
