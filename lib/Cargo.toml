[workspace]
resolver = "2"
members = ["crates/core", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
# opt-level 3, not "z", despite this shipping to size-constrained serverless.
#
# `opt-level = "z"` is the conventional wasm default and it is the wrong call
# here: it made the whole pipeline 3.5x slower, because a software rasterizer
# lives or dies on inlining and vectorisation. Combined with `+simd128` (see
# .cargo/config.toml) it is 4.8x slower. The size it buys back is ~20KB gzipped.
#
# Measured under workerd, not assumed — see bench/workerd.
opt-level = 3
lto = true
codegen-units = 1
strip = true
